[package]
name = "pointory"
version = "0.3.0"
edition = "2024"
build = "build.rs"
description = "A precise, task-based desktop mouse clicker built with Rust and Slint"
license = "MIT"

[dependencies]
dirs = "6"
enigo = "0.3"
global-hotkey = "0.7"
rand = "0.8"
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "~1.18", features = ["unstable-winit-030"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[profile.release]
codegen-units = 1
lto = true
strip = true
