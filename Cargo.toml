[package]
name = "pointory"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "A precise, task-based desktop mouse clicker built with Rust and Slint"
license = "MIT"

[dependencies]
dirs = "6"
enigo = "0.3"
global-hotkey = "0.7"
rand = "0.8"
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
